# Ține treaz proiectul Supabase (free tier-ul adoarme după ~7 zile fără cereri)
# și verifică din zbor că API-ul răspunde. Cheia publishable e publică prin design.
name: Keep alive Supabase

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST fw_jobs
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vrdjhhexyzsfzfwpcjhb.supabase.co/rest/v1/fw_jobs?select=id&limit=1" \
            -H "apikey: sb_publishable_KfSxQfvkP7R7iWUw94af3Q_iPMgBMoJ")
          echo "Supabase REST: HTTP $code"
          [ "$code" = "200" ] || exit 1
